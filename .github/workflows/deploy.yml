name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Install npm dependencies
        working-directory: src/FameBoy.Web
        run: npm ci

      - name: Build web app
        working-directory: src/FameBoy.Web
        run: dotnet fable --run npx vite build

      - name: Build blog
        if: github.repository == 'nickkossolapov/fame-boy'
        uses: docker://pandoc/core:3.8
        with:
          args: >-
            docs/blog.md
            --output=docs/index.html
            --standalone
            --lua-filter=docs/pandoc-filters.lua
            --syntax-highlighting=kate

      - name: Assemble Pages output
        if: github.repository == 'nickkossolapov/fame-boy'
        run: |
          mkdir -p src/FameBoy.Web/dist/building-a-game-boy-emulator-in-fsharp/images
          cp docs/index.html src/FameBoy.Web/dist/building-a-game-boy-emulator-in-fsharp/index.html
          cp docs/images/* src/FameBoy.Web/dist/building-a-game-boy-emulator-in-fsharp/images/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/FameBoy.Web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
