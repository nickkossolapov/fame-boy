<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FAME BOY</title>
    <link href="/styles.css" rel="stylesheet"/>
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/site.webmanifest" rel="manifest">
</head>
<body>
<div id="root">
    <div class="shell">
        <div class="screen-border">
            <canvas aria-label="Game screen" id="screen" role="img"></canvas>
        </div>
        <div class="buttons">
            <div class="d-pad" role="group">
                <div class="center"></div>
                <button aria-label="D-pad up" id="up-button"></button>
                <button aria-label="D-pad left" id="left-button"></button>
                <button aria-label="D-pad right" id="right-button"></button>
                <button aria-label="D-pad down" id="down-button"></button>
            </div>
            <div class="a-b-buttons" role="group">
                <button aria-label="A button" class="a-b-button" id="a-button"></button>
                <button aria-label="B button" class="a-b-button" id="b-button"></button>
            </div>
            <div class="start-select-buttons" role="group">
                <button aria-label="Select" class="start-select-button" id="select-button"></button>
                <button aria-label="Start" class="start-select-button" id="start-button"></button>
            </div>
        </div>
    </div>
    <label class="rom-upload" for="rom-file">
        Load ROM
        <input accept=".gb" id="rom-file" type="file">
    </label>
    <div class="controls">
        <table aria-label="Keyboard controls">
            <caption>Keyboard Controls</caption>
            <thead class="sr-only">
            <tr>
                <th scope="col">Input</th>
                <th scope="col">Key</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <th scope="row">A</th>
                <td>K</td>
            </tr>
            <tr>
                <th scope="row">B</th>
                <td>J</td>
            </tr>
            <tr>
                <th scope="row">Up</th>
                <td>W</td>
            </tr>
            <tr>
                <th scope="row">Down</th>
                <td>S</td>
            </tr>
            <tr>
                <th scope="row">Left</th>
                <td>A</td>
            </tr>
            <tr>
                <th scope="row">Right</th>
                <td>D</td>
            </tr>
            <tr>
                <th scope="row">Start</th>
                <td>N</td>
            </tr>
            <tr>
                <th scope="row">Select</th>
                <td>B</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="/Program.fs.js" type="module"></script>
</body>
</html>
