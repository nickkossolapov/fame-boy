<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FAME BOY</title>
    <link href="/styles.css" rel="stylesheet"/>
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="/site.webmanifest" rel="manifest">
</head>
<body>
<div id="root">
    <div class="shell">
        <div class="screen-border">
            <div class="screen-wrapper">
                <canvas aria-label="Game screen" id="screen" role="img"></canvas>
                <div class="start-overlay" id="start-overlay">Press any<br>button to start</div>
                <span class="fps-counter" id="fps-counter"></span>
            </div>
        </div>
        <div class="buttons">
            <div class="d-pad" role="group">
                <div class="center"></div>
                <button aria-label="D-pad up" id="up-button"></button>
                <button aria-label="D-pad left" id="left-button"></button>
                <button aria-label="D-pad right" id="right-button"></button>
                <button aria-label="D-pad down" id="down-button"></button>
            </div>
            <div class="a-b-buttons" role="group">
                <button aria-label="B button" class="a-b-button" id="b-button">B</button>
                <button aria-label="A button" class="a-b-button" id="a-button">A</button>
            </div>
            <div class="start-select-buttons" role="group">
                <button aria-label="Select" class="start-select-button" id="select-button">SELECT</button>
                <button aria-label="Start" class="start-select-button" id="start-button">START</button>
            </div>
            <button aria-label="Mute" class="mute-button" id="mute-button">
                <svg fill="currentColor" height="20" id="mute-icon-on" viewBox="0 0 24 24" width="20">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg class="hidden" fill="currentColor" height="20" id="mute-icon-off" viewBox="0 0 24 24" width="20">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="sidebar">
        <label class="rom-upload" for="rom-file">
            Upload your own ROM
            <input accept=".gb" id="rom-file" type="file">
        </label>
        <fieldset aria-label="Display scale" class="scale-selector">
            <legend>Size</legend>
            <label class="scale-option">
                <input name="scale" type="radio" value="0.5">
                <span>×0.5</span>
            </label>
            <label class="scale-option">
                <input checked name="scale" type="radio" value="1">
                <span>×1</span>
            </label>
            <label class="scale-option">
                <input name="scale" type="radio" value="1.5">
                <span>×1.5</span>
            </label>
            <label class="scale-option">
                <input name="scale" type="radio" value="2">
                <span>×2</span>
            </label>
        </fieldset>
        <label class="fps-toggle">
            <input id="show-fps" type="checkbox"> Show FPS
        </label>
        <div class="controls">
            <span class="controls-heading">Keyboard Controls</span>
            <table aria-label="Keyboard controls">
                <thead class="sr-only">
                <tr>
                    <th scope="col">Input</th>
                    <th scope="col">Key</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <th scope="row">A</th>
                    <td>K</td>
                </tr>
                <tr>
                    <th scope="row">B</th>
                    <td>J</td>
                </tr>
                <tr>
                    <th scope="row">↑ ← ↓ →</th>
                    <td>WASD</td>
                </tr>
                <tr>
                    <th scope="row">Start</th>
                    <td>N</td>
                </tr>
                <tr>
                    <th scope="row">Select</th>
                    <td>B</td>
                </tr>
                </tbody>
            </table>
        </div>
        <a aria-label="GitHub repository" class="github-link" href="https://github.com/nickkossolapov/fame-boy" rel="noopener noreferrer"
           target="_blank">
            <svg fill="currentColor" height="35" viewBox="0 0 16 16" width="35">
                <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
            </svg>
        </a>
        <span class="game-credit">
            Demo game is <a href="https://tangramgames.itch.io/tobu-tobu-girl-deluxe" rel="noopener noreferrer" target="_blank">Tobu Tobu Girl Deluxe</a>
        </span>
    </div>

</div>
<script src="/Program.fs.js" type="module"></script>
</body>
</html>
